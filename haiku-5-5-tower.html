<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haiku Tower Defense</title>
<style>
  :root {
    --ink: #0b0e11;
    --ink-2: #131920;
    --ink-3: #1b2330;
    --paper: #ece3cc;
    --paper-dim: #a39c86;
    --brass: #c9a24a;
    --brass-hi: #ebcb7a;
    --vermilion: #e4553b;
    --moss: #8dbb6e;
    --frost: #8fd8f0;
    --line: rgba(236, 227, 204, 0.13);
    --serif: "Didot", "Bodoni 72", "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "Avenir Next Condensed", "Gill Sans", "Gill Sans MT", "Trebuchet MS", sans-serif;
    --mono: "Menlo", "Monaco", "Courier New", monospace;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(900px 520px at 50% -12%, #2a3446 0%, transparent 68%),
      radial-gradient(700px 500px at 100% 110%, #2a2216 0%, transparent 60%),
      var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  #app {
    flex: none;
    width: 1224px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transform-origin: center center;
  }

  /* ---------- panels ---------- */
  .panel {
    position: relative;
    background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 240, 200, 0.04);
    animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .panel::after {
    content: "";
    position: absolute;
    top: 6px;
    right: 6px;
    width: 10px;
    height: 10px;
    border-top: 1px solid var(--brass);
    border-right: 1px solid var(--brass);
    opacity: 0.55;
  }
  #side .panel:nth-child(1) { animation-delay: 0.08s; }
  #side .panel:nth-child(2) { animation-delay: 0.14s; }
  #side .panel:nth-child(3) { animation-delay: 0.20s; }
  #side .panel:nth-child(4) { animation-delay: 0.26s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes unveil {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .title {
    margin: 0 0 9px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--brass);
  }
  .hint {
    margin-top: 7px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--paper-dim);
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 9px 18px;
  }
  .brand { display: flex; flex-direction: column; min-width: 128px; padding-right: 14px; border-right: 1px solid var(--line); }
  .brand-mark {
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1;
    color: var(--paper);
  }
  .brand-sub {
    margin-top: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--brass);
  }
  .stat { display: flex; flex-direction: column; min-width: 80px; }
  .stat .lbl {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--paper-dim);
  }
  .stat .val {
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 700;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .val.gold { color: var(--brass-hi); }
  .val.life { color: var(--vermilion); }

  /* pressure meter */
  #pressure { flex: 0 0 340px; display: flex; flex-direction: column; gap: 5px; }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; }
  .p-title { font-size: 10.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--paper-dim); }
  #pLabel { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--brass-hi); }
  .p-bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .p-seg { display: flex; flex-direction: column; gap: 3px; --lvl: #c9a24a; }
  .p-seg i {
    display: block;
    height: 8px;
    border-radius: 1px;
    background: rgba(236, 227, 204, 0.10);
    border: 1px solid rgba(236, 227, 204, 0.14);
  }
  .p-seg span {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--paper-dim);
    text-align: center;
    white-space: nowrap;
  }
  .p-seg.lvl-0 { --lvl: #8dbb6e; }
  .p-seg.lvl-1 { --lvl: #c9a24a; }
  .p-seg.lvl-2 { --lvl: #e8a33d; }
  .p-seg.lvl-3 { --lvl: #e4553b; }
  .p-seg.lvl-4 { --lvl: #c0245c; }
  .p-seg.on i { background: var(--lvl); border-color: transparent; }
  .p-seg.cur span { color: var(--paper); }
  .p-seg.bump i { animation: bump 0.9s ease-out; }
  @keyframes bump {
    0%   { box-shadow: 0 0 0 0 rgba(255, 220, 140, 0.95); }
    100% { box-shadow: 0 0 0 12px rgba(255, 220, 140, 0); }
  }

  #hStatus {
    white-space: nowrap;
    padding: 6px 12px;
    border: 1px solid var(--brass);
    border-radius: 2px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass-hi);
  }
  #hStatus[data-state="paused"] { color: var(--frost); border-color: var(--frost); }
  #hStatus[data-state="boss"] { color: var(--vermilion); border-color: var(--vermilion); }
  #hStatus[data-state="over"] { color: var(--vermilion); border-color: var(--vermilion); background: rgba(228, 85, 59, 0.08); }
  #hStatus[data-state="victory"] { color: var(--moss); border-color: var(--moss); }

  /* ---------- layout ---------- */
  #main { display: flex; gap: 14px; align-items: stretch; }
  #left { flex: none; width: 960px; display: flex; flex-direction: column; gap: 8px; }
  #stage {
    position: relative;
    flex: none;
    width: 960px;
    height: 600px;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(201, 162, 74, 0.35);
    animation: unveil 1.1s ease-out both;
  }
  #board { display: block; width: 960px; height: 600px; cursor: crosshair; }

  #logBar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 14px;
    min-height: 32px;
  }
  .tick-tag {
    flex: none;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brass);
  }
  #hMsg {
    flex: 1;
    min-width: 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--paper);
  }
  #hMsg.bad { color: #ff9f8c; }
  #hMsg.good { color: #b7dc95; }

  #legend {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    align-content: center;
    gap: 2px;
    padding: 6px 4px;
  }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; min-width: 0; }
  .chip canvas { width: 40px; height: 40px; }
  .chip b { font-size: 11px; font-weight: 700; color: var(--paper); white-space: nowrap; }
  .chip small { font-size: 9.5px; color: var(--paper-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  #side { flex: none; width: 250px; display: flex; flex-direction: column; gap: 10px; }

  #director .dir-line {
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--paper);
  }
  #director .dir-line em { font-style: normal; color: var(--brass-hi); }

  /* ---------- buttons ---------- */
  .btn {
    font: inherit;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--paper);
    background: rgba(236, 227, 204, 0.04);
    border: 1px solid rgba(201, 162, 74, 0.45);
    border-radius: 3px;
    padding: 9px 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s, transform 0.05s;
  }
  .btn:hover:not(:disabled) { background: rgba(201, 162, 74, 0.14); border-color: var(--brass-hi); color: #fff; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--frost); outline-offset: 2px; }

  .btn-main {
    width: 100%;
    padding: 13px 12px;
    font-size: 17px;
    letter-spacing: 0.22em;
    color: #1a0d07;
    border: none;
    background: linear-gradient(180deg, var(--brass-hi), var(--vermilion));
    box-shadow: 0 6px 22px rgba(228, 85, 59, 0.28);
  }
  .btn-main:hover:not(:disabled) { background: linear-gradient(180deg, #f3d98f, #f06a4f); color: #1a0d07; border: none; }
  .btn-main:disabled { background: #2b2f38; color: #7d8390; box-shadow: none; opacity: 1; }

  .btn-ghost { padding: 7px 12px; font-size: 11px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }

  /* ---------- towers ---------- */
  .tower-btn {
    width: 100%;
    display: grid;
    grid-template-columns: 38px 1fr auto;
    align-items: center;
    gap: 9px;
    text-align: left;
    text-transform: none;
    letter-spacing: 0;
    padding: 4px 9px 4px 4px;
    margin-bottom: 5px;
  }
  .tower-btn:last-child { margin-bottom: 0; }
  .tower-btn canvas {
    width: 38px;
    height: 38px;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.25);
  }
  .tower-btn.active {
    border-color: var(--frost);
    background: rgba(143, 216, 240, 0.09);
    box-shadow: inset 0 0 0 1px rgba(143, 216, 240, 0.5);
  }
  .tb-name { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--paper); }
  .tb-desc { display: block; font-size: 11px; color: var(--paper-dim); }
  .tb-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .tb-cost { font-family: var(--mono); font-size: 12px; color: var(--brass-hi); }
  .tower-btn.poor .tb-cost { color: var(--vermilion); }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
    color: var(--paper-dim);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 2px 5px;
  }

  /* ---------- inspector ---------- */
  #inspector { flex: 1; min-height: 210px; }
  .ins-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  #insIcon {
    width: 52px;
    height: 52px;
    flex: none;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--line);
  }
  .ins-name { font-family: var(--serif); font-size: 20px; font-weight: 700; line-height: 1.1; }
  .srow {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 0;
    border-bottom: 1px dotted rgba(236, 227, 204, 0.18);
    font-size: 12px;
  }
  .srow > span { color: var(--paper-dim); }
  .srow b { font-family: var(--mono); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .srow .up { color: var(--moss); }
  .jam-line {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #ff8f7a;
  }
  .act-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; }
  .act-t { font-size: 11.5px; letter-spacing: 0.1em; }
  .act-s { font-family: var(--mono); font-size: 10px; color: var(--paper-dim); letter-spacing: 0; text-transform: none; }

  /* ---------- end overlay ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 10, 12, 0.82);
    z-index: 5;
    animation: unveil 0.5s ease-out both;
  }
  .overlay-card {
    position: relative;
    width: 400px;
    padding: 30px 34px 28px;
    text-align: center;
    background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
    border: 1px solid var(--brass);
    border-radius: 4px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
  }
  .overlay-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--brass);
  }
  .overlay-card h1 {
    margin: 10px 0 12px;
    font-family: var(--serif);
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--paper);
  }
  .overlay-card p {
    margin: 0 0 22px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    line-height: 1.45;
    color: var(--paper-dim);
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud" class="panel">
    <div class="brand">
      <div class="brand-mark">HAIKU</div>
      <div class="brand-sub">Tower Command</div>
    </div>
    <div class="stat"><span class="lbl">Gold</span><span class="val gold" id="hGold">150</span></div>
    <div class="stat"><span class="lbl">Lives</span><span class="val life" id="hLives">20</span></div>
    <div class="stat"><span class="lbl">Wave</span><span class="val" id="hWave">0 / 20</span></div>
    <div class="stat"><span class="lbl">Enemies</span><span class="val" id="hEnemies">0</span></div>
    <div id="pressure">
      <div class="p-head"><span class="p-title">Pressure</span><span id="pLabel">Normal ×1.0</span></div>
      <div class="p-bars" id="pBars"></div>
    </div>
    <div id="hStatus" data-state="build">Build phase</div>
    <button id="restartBtn" class="btn btn-ghost">Restart</button>
  </header>

  <div id="main">
    <div id="left">
      <div id="stage">
        <canvas id="board" width="960" height="600"></canvas>
        <div id="endOverlay" class="overlay" hidden>
          <div class="overlay-card">
            <div class="overlay-kicker">Campaign report</div>
            <h1 id="endTitle"></h1>
            <p id="endText"></p>
            <button id="playAgain" class="btn btn-main">Play again</button>
          </div>
        </div>
      </div>
      <div id="logBar" class="panel">
        <span class="tick-tag">Log</span>
        <span id="hMsg"></span>
      </div>
      <div id="legend" class="panel"></div>
    </div>

    <aside id="side">
      <section class="panel" id="director">
        <h2 class="title" id="dirTag">Next wave</h2>
        <div class="dir-line" id="dirLine"></div>
      </section>

      <section class="panel" id="controls">
        <h2 class="title">Wave control</h2>
        <button id="sendBtn" class="btn btn-main">Send Wave</button>
        <div id="nextInfo" class="hint"></div>
        <div class="row2">
          <button id="speedBtn" class="btn">Speed 1x</button>
          <button id="pauseBtn" class="btn">Pause</button>
        </div>
      </section>

      <section class="panel" id="arsenal">
        <h2 class="title">Arsenal</h2>
        <div id="towerList"></div>
        <div class="hint">Right-click or Esc cancels. M moves the selected tower.</div>
      </section>

      <section class="panel" id="inspector">
        <h2 class="title">Selected</h2>
        <div id="insEmpty" class="hint">Click a placed tower to inspect, upgrade, move or sell it.</div>
        <div id="insBody" hidden>
          <div class="ins-head">
            <canvas id="insIcon" width="52" height="52"></canvas>
            <div>
              <div class="ins-name" id="insName"></div>
              <div class="hint" id="insLevel"></div>
            </div>
          </div>
          <div id="insStats"></div>
          <div class="jam-line" id="insJam" hidden></div>
          <div class="act-row">
            <button id="upBtn" class="btn act"><span class="act-t">Upgrade</span><span class="act-s" id="upCost"></span></button>
            <button id="moveBtn" class="btn act"><span class="act-t" id="moveLabel">Move</span><span class="act-s" id="moveFee"></span></button>
            <button id="sellBtn" class="btn act"><span class="act-t">Sell</span><span class="act-s" id="sellVal"></span></button>
          </div>
        </div>
      </section>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ================= Constants ================= */
  const CELL = 40;
  const COLS = 24;
  const ROWS = 15;
  const W = COLS * CELL;               // 960
  const H = ROWS * CELL;               // 600
  const MAX_WAVE = 20;
  const START_GOLD = 150;
  const START_LIVES = 20;
  const SELL_RATE = 0.7;
  const MOVE_FEE = 0.15;
  const TAU = Math.PI * 2;
  const SUB_STEP = 1 / 60;
  const SAMPLE_STEP = 16;
  const HEAL_RANGE = 60;
  const SABOTAGE_RANGE = 50;
  const BOSS_JAM_RANGE = 170;
  const MONO = '"Menlo", "Monaco", "Courier New", monospace';

  const PRESSURE = [
    { name: 'Easy', mult: 0.8 },
    { name: 'Normal', mult: 1.0 },
    { name: 'Hard', mult: 1.2 },
    { name: 'Brutal', mult: 1.4 },
    { name: 'Nightmare', mult: 1.6 },
  ];

  const TOWER_ORDER = ['archer', 'cannon', 'frost', 'sniper'];
  const TOWERS = {
    archer: {
      name: 'Archer', key: '1', cost: 50, color: '#d9b25c', target: 'first',
      desc: 'Fast, single target',
      upgrade: [40, 75, 120],
      levels: [
        { dmg: 9,  cd: 0.50, range: 125, speed: 620 },
        { dmg: 15, cd: 0.44, range: 135, speed: 640 },
        { dmg: 24, cd: 0.38, range: 145, speed: 660 },
        { dmg: 38, cd: 0.30, range: 155, speed: 700 },
      ],
    },
    cannon: {
      name: 'Cannon', key: '2', cost: 100, color: '#e4553b', target: 'first',
      desc: 'Slow, splash damage',
      upgrade: [70, 120, 190],
      levels: [
        { dmg: 30,  cd: 1.60, range: 115, speed: 260, splash: 52 },
        { dmg: 46,  cd: 1.50, range: 120, speed: 270, splash: 60 },
        { dmg: 68,  cd: 1.40, range: 125, speed: 280, splash: 68 },
        { dmg: 105, cd: 1.25, range: 130, speed: 290, splash: 78 },
      ],
    },
    frost: {
      name: 'Frost', key: '3', cost: 80, color: '#8fd8f0', target: 'first',
      desc: 'Slows enemies',
      upgrade: [55, 90, 140],
      levels: [
        { dmg: 5,  cd: 1.00, range: 115, speed: 420, slow: 0.50, slowDur: 2.0 },
        { dmg: 8,  cd: 0.95, range: 120, speed: 440, slow: 0.42, slowDur: 2.6 },
        { dmg: 12, cd: 0.90, range: 125, speed: 460, slow: 0.35, slowDur: 3.2 },
        { dmg: 18, cd: 0.85, range: 130, speed: 480, slow: 0.25, slowDur: 4.0 },
      ],
    },
    sniper: {
      name: 'Sniper', key: '4', cost: 150, color: '#b9a7e8', target: 'strongest',
      desc: 'Long range, high damage',
      upgrade: [120, 180, 270],
      levels: [
        { dmg: 110, cd: 2.20, range: 280, speed: 1300 },
        { dmg: 170, cd: 2.00, range: 300, speed: 1400 },
        { dmg: 260, cd: 1.90, range: 315, speed: 1500 },
        { dmg: 400, cd: 1.70, range: 335, speed: 1600 },
      ],
    },
  };

  const ENEMIES = {
    grunt:     { name: 'Grunt', role: 'Basic', hp: 40, speed: 65, reward: 6, leak: 1, r: 13, color: '#9bc26b', edge: '#2c3a1c' },
    runner:    { name: 'Runner', role: 'Fast, frail', hp: 24, speed: 120, reward: 5, leak: 1, r: 10, color: '#e8c547', edge: '#4a3d0c' },
    tank:      { name: 'Tank', role: 'Heavy, leaks 2', hp: 190, speed: 42, reward: 14, leak: 2, r: 17, color: '#8f86c9', edge: '#25204a' },
    armored:   { name: 'Armored', role: 'Resists arrows', hp: 150, speed: 40, reward: 12, leak: 2, r: 16, color: '#7b8797', edge: '#1d232c', armor: { archer: 0.4, sniper: 0.4 } },
    swarm:     { name: 'Swarm', role: 'Tiny, many', hp: 16, speed: 150, reward: 3, leak: 1, r: 7, color: '#d4f04a', edge: '#4b5a0c' },
